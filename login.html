<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Stackly</title>
  <meta name="description" content="Sign in to your Stackly dashboard.">
  <link rel="icon" type="image/webp" href="assets/logo/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <div id="page-transition"></div>

  <header class="auth-topbar">
    <div class="auth-topbar-logo">
      <img src="assets/logo/logo.webp" class="navbar-logo" alt="Stackly logo" width="150" height="34">
    </div>
    <a href="index.html" class="auth-back-btn" data-magnetic aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back
    </a>
  </header>

  <main id="main">
    <div class="auth-shell">
      <div class="auth-visual">
        <img src="assets/images/index4.webp" alt="Creative workspace" loading="lazy">
        <div class="overlay"></div>
        <blockquote>"The kind of studio that actually ships what the deck promised."</blockquote>
        <cite>— Daniel Osei, Orbital</cite>
      </div>

      <div class="auth-form-wrap">
        <div class="auth-form">
          <h1 data-reveal="fade-up" data-split="words">Welcome back</h1>
          <p>Sign in to view your dashboard.</p>

          <form id="login-form" novalidate>
            <div class="role-select">
              <button type="button" class="role-btn is-active" data-role="public">
                <strong>Public</strong>
                <span>Client / member view</span>
              </button>
              <button type="button" class="role-btn" data-role="admin">
                <strong>Admin</strong>
                <span>Studio owner view</span>
              </button>
            </div>

            <div class="form-field">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" placeholder="you@example.com" required>
              <span class="form-error"></span>
            </div>

            <div class="form-field password-field">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" placeholder="••••••••" required>
              <button type="button" class="eye-toggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <g class="eye-open"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></g>
                  <path class="eye-closed" d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C4 8.3 2 12 2 12s4 7 11 7c1.7 0 3.2-.4 4.5-1M17.5 6.6C19.6 8 21 10.5 21.5 11.5"/>
                </svg>
              </button>
              <span class="form-error"></span>
              <span class="password-hint">At least 8 characters.</span>
            </div>

            <div class="auth-meta-row">
              <label class="remember"><input type="checkbox"> Remember me</label>
              <a href="404.html">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" data-magnetic>Login</button>
          </form>

          <p class="auth-switch">Don't have an account? <a href="create-account.html">Create one</a></p>
        </div>
      </div>
    </div>
  </main>
  <div class="form-toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/validation.js"></script>

</body>
</html>
